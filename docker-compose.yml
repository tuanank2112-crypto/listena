version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: listena-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: listena
      POSTGRES_PASSWORD: listena123
      POSTGRES_DB: listena
    volumes:
      - pgdata:/var/lib/postgresql/data

  tts:
    build: ./tts-service
    container_name: listena-tts
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      HF_HOME: /data/hf
      TTS_CACHE_DIR: /app/cache
    volumes:
      - tts-hf-cache:/data/hf
      - tts-audio-cache:/app/cache
    # Chỉ 1 worker: mỗi worker load một bản model vào RAM

volumes:
  pgdata:
  tts-hf-cache:
  tts-audio-cache:
