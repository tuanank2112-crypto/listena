version: "1"

services:
  - type: web
    name: listena
    env: node
    region: oregon
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: listena-db
          property: connectionString
      - key: NEXTAUTH_URL
        value: https://listena.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      # Kira is the current provider target. Add KIRAAI_API_KEY only through
      # Render's secret UI; this blueprint never contains its value. To switch
      # to OpenAI, set AI_PROVIDER=openai and use OPENAI_* settings instead.
      - key: AI_PROVIDER
        value: kira
      - key: KIRAAI_MODEL
        value: glm-5.3-flash-free
      - key: KIRAAI_BASE_URL
        value: https://kiraai.vn/api/v1
      - key: KIRAAI_API_KEY
        sync: false
      - key: TTS_PROVIDER
        value: mock
      - key: LOG_LEVEL
        value: info

databases:
  - name: listena-db
    databaseName: listena
    user: listena
    region: oregon
    plan: free
