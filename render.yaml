version: "1"

services:
  - type: web
    name: listena
    env: node
    region: oregon
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: listena-db
          property: connectionString
      - key: NEXTAUTH_URL
        value: https://listena.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: mock
      - key: TTS_PROVIDER
        value: mock
      - key: LOG_LEVEL
        value: info

databases:
  - name: listena-db
    databaseName: listena
    user: listena
    region: oregon
    plan: free
