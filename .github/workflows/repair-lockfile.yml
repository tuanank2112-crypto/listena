name: Repair npm lockfile

on:
  push:
    branches: ["codex/fix-ci-lockfile"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: codex/fix-ci-lockfile

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile with CI npm
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install contract
        run: npm ci --ignore-scripts

      - name: Commit npm-generated lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(ci): synchronize npm lockfile for Node 24"
          git push origin HEAD:codex/fix-ci-lockfile
